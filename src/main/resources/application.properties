spring.application.name=ledger-service
server.port=8080
# Corporate SSO adds large headers in front of this service.
server.max-http-header-size=16KB

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.open-in-view=false
spring.jpa.properties.javax.persistence.query.timeout=5000

# Lab key only. Production reads it from the vault.
ledger.signing.key=lab-signing-key-not-for-production-use

logging.pattern.level=%5p [%X{requestId:-}]
